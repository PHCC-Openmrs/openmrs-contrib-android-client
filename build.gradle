// Top-level build file where you can add configuration options common to all sub-projects/modules.
buildscript {
    ext.kotlin_version = '2.2.21'
    ext.safeargs_version = '2.8.9'
    repositories {
        google()
        mavenCentral()
        maven { url "https://plugins.gradle.org/m2/" }
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.11.1'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
        classpath "androidx.navigation:navigation-safe-args-gradle-plugin:$safeargs_version"

        // Hilt Plugin
        classpath 'com.google.dagger:hilt-android-gradle-plugin:2.58'
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
        maven { url 'https://yanzm.github.io/MaterialTabHost/repository' }
        maven { url "https://oss.sonatype.org/content/repositories/snapshots/" }
        maven { url "https://jitpack.io" }
    }
}
