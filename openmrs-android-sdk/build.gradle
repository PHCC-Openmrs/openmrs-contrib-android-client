plugins {
    id 'com.android.library'
    id 'kotlin-android'
    id 'maven-publish'
    id 'kotlin-kapt'
    id 'dagger.hilt.android.plugin'
}

// Keep the sdk module's SDK levels and shared library versions in lockstep with the app.
apply from: '../openmrs-client/versions.gradle'

android {
    namespace 'com.openmrs.android_sdk'
    compileSdk versions.compileSdk
    buildToolsVersion versions.buildTools

    defaultConfig {
        minSdk versions.minSdk
        // No targetSdk here: it is a no-op for library modules on AGP 8. The consuming
        // application module (openmrs-client) supplies it.

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        consumerProguardFiles "consumer-rules.pro"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    testOptions {
        unitTests {
            includeAndroidResources = true
        }
    }

    publishing {
        singleVariant("release") {
            withSourcesJar()
            withJavadocJar()
        }
    }
}

dependencies {

    implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation "androidx.appcompat:appcompat:${versions.appcompat}"
    implementation "com.google.android.material:material:${versions.material}"
    implementation "com.google.code.gson:gson:${versions.gson}"

    // room
    implementation "androidx.room:room-runtime:${versions.roomRuntime}"
    implementation "androidx.room:room-rxjava2:${versions.roomRuntime}"

    //no inspection
    kapt "androidx.room:room-compiler:${versions.roomCompiler}"

    // joda time
    implementation "joda-time:joda-time:${versions.jodaTime}"

    // rx java dependencies
    implementation "io.reactivex.rxjava2:rxjava:${versions.rxjava}"
    implementation "io.reactivex.rxjava2:rxandroid:${versions.rxandroid}"
    implementation "com.jakewharton.rxbinding:rxbinding:${versions.rxbinding}"

    //bcrypt
    implementation "org.mindrot:jbcrypt:${versions.jbcrypt}"

    //jdeferred
    implementation "org.jdeferred:jdeferred-android-aar:${versions.jdeferred}"

    //networking and processing
    implementation "com.squareup.retrofit2:retrofit:${versions.retrofit}"
    implementation "com.squareup.retrofit2:converter-gson:${versions.retrofitConverter}"

    // Work Manager
    implementation "androidx.work:work-runtime:${versions.workManager}"

    // test implementation
    testImplementation 'junit:junit:4.+'
    androidTestImplementation 'androidx.test.ext:junit:1.1.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.3.0'

    //Mockito
    testImplementation "org.mockito:mockito-core:5.2.0"

    //mockK library
    testImplementation "io.mockk:mockk:1.11.0"

    //Mockwebserver
    testImplementation 'com.squareup.okhttp3:mockwebserver:4.0.0'

    //Test Runners
    testImplementation "androidx.test:core:1.4.0"

    //Roboelectric
    testImplementation 'org.robolectric:robolectric:4.6.1'

    // http request Chucker Library
    debugImplementation "com.github.chuckerteam.chucker:library:${versions.chuckerLibrary}"
    releaseImplementation "com.github.chuckerteam.chucker:library-no-op:${versions.chuckerLibrary}"

    // Hilt Dependency Injection
    implementation "com.google.dagger:hilt-android:${versions.hilt}"
    kapt "com.google.dagger:hilt-compiler:${versions.hilt}"
    implementation "androidx.hilt:hilt-work:${versions.androidxHilt}"
    kapt "androidx.hilt:hilt-compiler:${versions.androidxHilt}" /* Use it for Kotlin Workers */
    annotationProcessor "androidx.hilt:hilt-compiler:${versions.androidxHilt}" /* Use it for Java Workers */

    // Hilt local unit testing
    testImplementation "com.google.dagger:hilt-android-testing:${versions.hilt}"
    kaptTest "com.google.dagger:hilt-compiler:${versions.hilt}"
}

kapt {
    correctErrorTypes true
}

afterEvaluate {
    publishing {
        publications {
            release(MavenPublication) {
                from components.release

                groupId = 'com.openmrs.AndroidSDK'
                artifactId = 'openmrs'
                version = '1.0.0'
            }
        }
    }
}
