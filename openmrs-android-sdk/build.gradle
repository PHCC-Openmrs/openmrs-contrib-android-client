plugins {
    id 'com.android.library'
    id 'kotlin-android'
    id 'maven-publish'
    id 'org.jetbrains.dokka'
    id 'kotlin-kapt'
    id 'dagger.hilt.android.plugin'
}

android {
    namespace 'com.openmrs.android_sdk'
    compileSdk 36
    buildToolsVersion '36.0.0'

    defaultConfig {
        minSdk 21

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        consumerProguardFiles "consumer-rules.pro"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    testOptions {
        unitTests {
            includeAndroidResources = true
            // OkHttp's Android platform probe calls into android.jar stubs (NetworkSecurityPolicy),
            // which throw unless unmocked methods return defaults. Matches the app module.
            returnDefaultValues = true
            // Mockito/Objenesis reflect into java.base internals, which JDK 17 blocks by default.
            all {
                it.jvmArgs '--add-opens=java.base/java.lang=ALL-UNNAMED',
                        '--add-opens=java.base/java.lang.reflect=ALL-UNNAMED',
                        '--add-opens=java.base/java.util=ALL-UNNAMED',
                        '--add-opens=java.base/java.text=ALL-UNNAMED'
                // These tests drive blocking HTTP calls against MockWebServer; a request that
                // never completes would otherwise hang the build indefinitely.
                it.timeout.set(java.time.Duration.ofMinutes(10))
            }
        }
    }
    // hilt {
    //     enableTransformForLocalTests = true
    // }
    dependencies {

        implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"
        implementation 'androidx.core:core-ktx:1.13.1'
        implementation 'androidx.appcompat:appcompat:1.7.0'
        implementation 'com.google.android.material:material:1.12.0'
        implementation 'com.google.code.gson:gson:2.8.5'

        // room
        implementation 'androidx.room:room-runtime:2.6.1'
        implementation 'androidx.room:room-rxjava2:2.6.1'
        // implementation 'android.arch.persistence.room:rxjava2:1.1.1'

        //no inspection
        kapt 'androidx.room:room-compiler:2.6.1'

        // joda time
        implementation 'joda-time:joda-time:2.10.6'

        // rx java dependencies
        implementation 'io.reactivex.rxjava2:rxjava:2.2.6'
        implementation 'io.reactivex.rxjava2:rxandroid:2.1.1'
        implementation 'com.jakewharton.rxbinding:rxbinding:1.0.0'

        //bcrypt
        implementation 'org.mindrot:jbcrypt:0.4'

        //jdeferred
        implementation 'org.jdeferred:jdeferred-android-aar:1.2.6'

        //networking and processing
        implementation "com.squareup.retrofit2:retrofit:2.3.0"
        implementation "com.squareup.retrofit2:converter-gson:2.1.0"
        implementation "com.google.code.gson:gson:2.8.5"

        // Work Manager
        implementation "androidx.work:work-runtime:2.10.0"

        // test implementation
        testImplementation 'junit:junit:4.+'
        androidTestImplementation 'androidx.test.ext:junit:1.1.1'
        androidTestImplementation 'androidx.test.espresso:espresso-core:3.3.0'

        //Mockito
        testImplementation "org.mockito:mockito-core:5.2.0"

        //mockK library
        testImplementation "io.mockk:mockk:1.11.0"

        //Mockwebserver
        testImplementation 'com.squareup.okhttp3:mockwebserver:4.0.0'

        //Test Runners
        testImplementation "androidx.test:core:1.4.0"

        //Roboelectric
        testImplementation 'org.robolectric:robolectric:4.14.1'

        // http request Chucker Library
        debugImplementation "com.github.chuckerteam.chucker:library:3.4.0"
        releaseImplementation "com.github.chuckerteam.chucker:library-no-op:3.4.0"

        // Hilt Dependency Injection
        implementation "com.google.dagger:hilt-android:$hilt_version"
        kapt "com.google.dagger:hilt-compiler:$hilt_version"
        implementation("androidx.hilt:hilt-work:1.2.0")
        kapt("androidx.hilt:hilt-compiler:1.2.0") /* Use it for Kotlin Workers */
        annotationProcessor("androidx.hilt:hilt-compiler:1.2.0") /* Use it for Java Workers */

        // Hilt local unit testing
        testImplementation "com.google.dagger:hilt-android-testing:$hilt_version"
        kaptTest "com.google.dagger:hilt-compiler:$hilt_version"
    }

    kapt {
        correctErrorTypes true
    }

    publishing {
        singleVariant("release") {
            withSourcesJar()
            withJavadocJar()
        }
    }
}

afterEvaluate {
    publishing {
        publications {
            release(MavenPublication) {
                from components.release

                groupId = 'com.openmrs.AndroidSDK'
                artifactId = 'openmrs'
                version = '1.0.0'
            }
        }
    }
}

dokkaHtml.configure {
    dokkaSourceSets {
        named("main") {
            noAndroidSdkLink.set(false)
        }
    }
}
